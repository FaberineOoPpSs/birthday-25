<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Baby 🎂✨</title>
  <link rel="stylesheet" href="scene.css" />

  <!-- Three.js r165 via CDN (ES modules) -->
  <script type="importmap">
  {
    "imports": {
      "three":            "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/":    "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- ══════════════════════════════════════════════════════════
       WebGL Canvas — occupies the full viewport
       ══════════════════════════════════════════════════════════ -->
  <canvas id="three-canvas"></canvas>

  <!-- ══════════════════════════════════════════════════════════
       2-D HUD overlays
       ══════════════════════════════════════════════════════════ -->

  <!-- Top greeting badge -->
  <header id="hud-header">
    <span class="sparkle-emoji">✨</span>
    <span id="hud-title">A very special day&hellip;</span>
    <span class="sparkle-emoji">✨</span>
  </header>

  <!-- Envelope click prompt (fades in after 2 s) -->
  <div id="envelope-hint">
    <div class="hint-ring"></div>
    <p>Click the envelope to open your letter</p>
  </div>

  <!-- Fullscreen transition overlay -->
  <div id="transition-overlay"></div>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-cake">🎂</div>
    <p>Preparing something special&hellip;</p>
    <div class="loader-bar"><div id="loader-progress"></div></div>
  </div>

  <!-- Main Three.js scene script -->
  <script type="module" src="scene.js"></script>
</body>
</html>
