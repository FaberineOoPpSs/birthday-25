<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happiest 25th Birthday Shivani! 🎂✨</title>
  <link rel="stylesheet" href="scene.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Nunito:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap"
    rel="stylesheet" />

  <!-- Three.js r165 via CDN -->
  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <!-- WebGL canvas — full viewport -->
  <canvas id="three-canvas"></canvas>

  <!-- ─── Birthday heading (top-center) ─── -->
  <div id="page-title">
    <span class="title-word t1">Happiest</span>
    <span class="title-word t2">25th</span>
    <span class="title-word t3">Birthday</span>
    <span class="title-word t4">Shivani!</span>
    <span class="title-star">✦</span>
  </div>

  <!-- ─── "Open this letter" label ─── -->
  <div id="open-letter-label">
    <div class="ol-pulse-ring"></div>
    <div class="ol-content">
      <span class="ol-icon">✉</span>
      <span class="ol-text">Open this letter</span>
      <span class="ol-arrow">↗</span>
    </div>
  </div>

  <!-- Fullscreen transition overlay -->
  <div id="transition-overlay"></div>

  <!-- Loading screen -->
  <div id="loader">
    <div class="loader-icon">🎂</div>
    <p class="loader-msg">Setting table & ballons&hellip;</p>
    <div class="loader-bar-track">
      <div id="loader-fill"></div>
    </div>
  </div>

  <script type="module" src="scene.js"></script>
</body>

</html>
